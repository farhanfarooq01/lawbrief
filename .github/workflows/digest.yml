name: Morning Brief

on:
  schedule:
    # 01:00 UTC = 06:30 IST. GitHub's cron can run late by 5-20 minutes
    # under load, which is fine for a daily digest.
    - cron: "0 1 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]        # tests only; the send step is skipped on push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  send:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
        run: python -m src.digest
