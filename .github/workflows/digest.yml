name: Morning Brief

on:
  schedule:
    # Fallback only. A Cloudflare Worker dispatches this at 06:00 IST;
    # GitHub's own scheduler queues behind other work on free public
    # repos and has run over four hours late. This later slot exists so
    # a digest still arrives on days the Worker fails.
    - cron: "0 3 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]        # tests only; the send step is skipped on push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  send:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          # Non-secret settings. Each falls back to the default in
          # config.py if the repository variable isn't set.
          GEMINI_MODEL:     ${{ vars.GEMINI_MODEL }}
          REQUEST_DELAY:    ${{ vars.REQUEST_DELAY }}
          PRE_SUMMARY_CAP:  ${{ vars.PRE_SUMMARY_CAP }}
          MAX_ITEMS:        ${{ vars.MAX_ITEMS }}
          TOP_N:            ${{ vars.TOP_N }}
        run: python -m src.digest
